name: Build and Push Docker Images to registries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Explicit release tag to build (e.g. v1.2.3), use to override the default latest-tag derivation
        type: string
        required: false
      push:
        description: Whether to push the built image to the registry
        type: boolean
        required: false
        default: true

jobs:
  build:
    name: "Build and publish docker image"
    runs-on: ["Linux", "platform-builder-docker-xl"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # we need tags to derive release version in case not provided
      - uses: extractions/setup-just@v3

      - name: Log in to a Container Registry
        if: ${{ github.event_name == 'release' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: 'eccr.ecmwf.int'
          username: ${{ secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}

      - name: Build image
        working-directory: deployment/v2
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          just buildRelease "$RELEASE_TAG"

      - name: Publish image
        if: ${{ github.event_name == 'release' || inputs.push }}
        working-directory: deployment/v2
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          just publish "$RELEASE_TAG"
