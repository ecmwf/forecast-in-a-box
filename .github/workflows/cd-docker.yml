name: Build and Push Docker Images to registries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Explicit release tag to build (e.g. v1.2.3), use to override the default latest-tag derivation
        type: string
        required: false
      push:
        description: Whether to push the built image to the registry
        type: boolean
        required: false
        default: true

jobs:
  buildPublish:
    name: "Build and publish docker image"
    strategy:
      matrix:
        registry: ["ghcr", "eccr"]
        platform: ["x86", "aarch64"]
    runs-on: "${{ fromJSON('{\"x86\": [\"Linux\", \"platform-builder-docker-xl\"], \"aarch64\": \"platform-builder-ubuntu-2404-arm64-000\"}')[matrix.platform] }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # we need tags to derive release version in case not provided
      - uses: extractions/setup-just@v3

      - name: Log in to a Container Registry
        if: ${{ github.event_name == 'release' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ matrix.registry == 'ghcr' && 'ghcr.io' || 'eccr.ecmwf.int' }}
          username: ${{ matrix.registry == 'ghcr' && github.actor || secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          password: ${{ matrix.registry == 'ghcr' && secrets.GITHUB_TOKEN || secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}

      - name: Build single image
        working-directory: deployment/v2
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          just buildRelease "$RELEASE_TAG"

      - name: Publish single image
        if: ${{ github.event_name == 'release' || inputs.push }}
        working-directory: deployment/v2
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          # NOTE unhealthily coupled with the justfile -- perhaps expose an action to obtain the built image tags?
          if [[ "${{ matrix.registry }}" == "eccr" ]] ; then
            registry="eccr.ecmwf.int/forecast-in-a-box/fiab-slim"
          else
            registry="ghcr.io/${{ github.repository }}/fiab-slim"
          fi
          target="${registry}:${RELEASE_TAG}-${{ matrix.platform }}"
          docker tag "fiab-slim:release" "${target}"
          docker push "${target}"

  manifest:
    needs: buildPublish
    name: "Create manifests to unify architectures"
    strategy:
      matrix:
        registry: ["ghcr", "eccr"]
    runs-on: [self-hosted, macOS]
    steps:
      - name: Log in to a Container Registry
        if: ${{ github.event_name == 'release' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ matrix.registry == 'ghcr' && 'ghcr.io' || 'eccr.ecmwf.int' }}
          username: ${{ matrix.registry == 'ghcr' && github.actor || secrets.ECMWF_DOCKER_REGISTRY_USERNAME }}
          password: ${{ matrix.registry == 'ghcr' && secrets.GITHUB_TOKEN || secrets.ECMWF_DOCKER_REGISTRY_ACCESS_TOKEN }}
      - name: Push the manifest
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [[ "${{ matrix.registry }}" == "eccr" ]] ; then
            registry="eccr.ecmwf.int/forecast-in-a-box/fiab-slim"
          else
            registry="ghcr.io/${{ github.repository }}/fiab-slim"
          fi
          target="${registry}:${RELEASE_TAG}"
          docker manifest create "${target}" \
            "${target}-x86" \
            "${target}-arm64
          docker manifest push "${target}"
